# Configuración Wrangler — desarrollo local y referencia de bindings.
# En producción: dashboard Pages (bindings + env) o npm run setup-push

name = "sacred-geometry"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "."

# Local: npm run pages:dev usa --kv=SUBSCRIPTIONS (KV en memoria).
# Producción: binding SUBSCRIPTIONS en el dashboard o scripts/setup-cloudflare-push.mjs
# Si tienes un namespace real, descomenta:
# [[kv_namespaces]]
# binding = "SUBSCRIPTIONS"
# id = "xxxxxxxx"
# preview_id = "yyyyyyyy"

# Vars locales: archivo .dev.vars (VAPID_*, NOTIFY_SECRET) — no se sube a git
